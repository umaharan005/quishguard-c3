[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "quishguard"
version = "0.1.0"
description = "QR code phishing (quishing) detection: ViT tamper detector + URL behavioural analysis (SLIIT J26-IT-424, component C3)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
